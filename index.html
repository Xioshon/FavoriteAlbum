<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="description" content="和朋友或陌生人实时选择陈奕迅每张代表专辑里最喜欢的一首歌。">
  <title>ONE / ONE · Eason</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise"></div>

  <main id="home" class="home">
    <nav><b>ONE / ONE</b><span id="authStatus">正在连接</span></nav>
    <section class="intro">
      <p class="kicker">EASON CHAN · TWO PLAYER</p>
      <h1>同一张唱片，<br><i>你会留下哪首？</i></h1>
      <p>八张代表作，随机顺序。和朋友或陌生人同时选择，看看你们听见的是不是同一种陈奕迅。</p>
    </section>
    <section class="lobby-card">
      <label class="name-field"><span>你的名字</span><input id="playerName" maxlength="12" placeholder="输入昵称" value="我"></label>
      <button id="matchBtn" class="main-action"><span><small>QUICK MATCH</small>匹配陌生人</span><b>↗</b></button>
      <div class="or"><span>或者</span></div>
      <div class="room-actions">
        <button id="createBtn" class="sub-action">创建私人房间</button>
        <div class="join"><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="输入 6 位房间号"><button id="joinBtn">加入</button></div>
      </div>
      <p id="lobbyMessage" class="hint">匿名进入，不需要注册账号。</p>
    </section>
  </main>

  <main id="waiting" class="waiting hidden">
    <div class="waiting-orbit"><div></div></div>
    <p class="kicker">ROOM <span id="waitingCode"></span></p>
    <h2 id="waitingTitle">等待另一位听众…</h2>
    <p id="waitingText">把房间号发给朋友，或留在这里等待匹配。</p>
    <button id="copyCode" class="pill">复制房间号</button>
    <button class="leave ghost">离开房间</button>
  </main>

  <main id="game" class="game hidden">
    <header class="game-head">
      <button class="leave icon-btn" aria-label="离开">←</button>
      <div><b id="peerName">另一位听众</b><span><i id="onlineDot"></i><span id="roomState">实时连接中</span></span></div>
      <button id="roomBadge" class="room-badge"></button>
    </header>

    <section id="chat" class="chat" aria-live="polite"></section>

    <footer class="composer">
      <button id="songInput" class="song-input"><span>选择这一张的歌…</span><b>＋</b></button>
      <button id="passGame" class="pass">PASS</button>
    </footer>
  </main>

  <section id="result" class="result hidden">
    <p class="kicker">FINAL MATCH</p>
    <div id="score" class="score">0%</div>
    <h2 id="resultTitle"></h2>
    <p id="resultCopy"></p>
    <div id="resultList" class="result-list"></div>
    <button id="homeBtn" class="main-action"><span>再来一局</span><b>↗</b></button>
  </section>

  <dialog id="songs">
    <div class="sheet-head"><div><p class="kicker">CHOOSE ONE</p><h3 id="sheetAlbum"></h3></div><button class="close icon-btn">×</button></div>
    <div id="trackList" class="track-list"></div>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
